<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo AI — Your Business Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #191919;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0ee;
      --muted: #6b6b68;
      --accent: #E8001D;
      --accent2: rgba(232,0,29,0.12);
      --user-bubble: #1a1a1a;
      --ai-bubble: #141414;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* noise */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* glow orb */
    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,0,29,0.06) 0%, transparent 70%);
      top: -200px; right: -100px;
      pointer-events: none;
      animation: orbDrift 12s ease-in-out infinite alternate;
    }

    @keyframes orbDrift {
      from { transform: translate(0,0); }
      to { transform: translate(-60px, 80px); }
    }

    /* ── NAV ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 64px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: var(--font-head);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-head);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .status-dot {
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-head);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ── HERO (shown when no messages) ── */
    .hero {
      position: absolute;
      inset: 64px 0 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 40px 24px;
      transition: opacity 0.4s, transform 0.4s;
      pointer-events: none;
    }

    .hero.hidden { opacity: 0; transform: translateY(-20px); pointer-events: none; }

    .hero-eyebrow {
      font-family: var(--font-head);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .hero-title {
      font-family: var(--font-head);
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 20px;
    }

    .hero-title em {
      font-style: normal;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.25);
    }

    .hero-sub {
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
      max-width: 380px;
      line-height: 1.65;
      margin-bottom: 48px;
    }

    /* SUGGESTIONS */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 640px;
      pointer-events: all;
    }

    .suggestion-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 400;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .suggestion-btn:hover {
      background: var(--surface2);
      border-color: var(--border2);
      color: var(--text);
    }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    .chat-inner {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* MESSAGE BUBBLES */
    .msg {
      display: flex;
      gap: 14px;
      padding: 6px 0;
      animation: msgIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .msg.ai .msg-avatar {
      background: var(--accent);
      color: white;
    }

    .msg.user .msg-avatar {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--muted);
    }

    .msg-bubble {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .msg.ai .msg-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg.user .msg-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--border2);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    /* markdown-ish rendering */
    .msg-bubble strong { font-weight: 500; color: var(--text); }
    .msg-bubble em { color: var(--muted); font-style: italic; }
    .msg-bubble code {
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .msg-bubble ul, .msg-bubble ol {
      margin: 8px 0 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg-bubble p + p { margin-top: 8px; }
    .msg-bubble a { color: var(--accent); text-decoration: underline; }

    /* TYPING */
    .typing-indicator {
      display: flex;
      gap: 14px;
      padding: 6px 0;
      align-items: flex-start;
    }

    .typing-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 0.65rem;
      font-weight: 700;
      color: white;
      margin-top: 2px;
    }

    .typing-dots {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 16px 20px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── INPUT BAR ── */
    .input-bar {
      flex-shrink: 0;
      padding: 16px 24px 24px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      position: relative;
      z-index: 10;
    }

    .input-wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 12px 14px 12px 20px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: rgba(232,0,29,0.4); }

    textarea#msgInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      overflow-y: auto;
      padding: 2px 0;
    }

    textarea#msgInput::placeholder { color: var(--muted); }

    textarea#msgInput::-webkit-scrollbar { width: 2px; }
    textarea#msgInput::-webkit-scrollbar-thumb { background: var(--border2); }

    .send-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .send-btn:hover { background: #ff1f3d; transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--surface2); cursor: not-allowed; transform: none; }

    .send-btn svg { width: 16px; height: 16px; }

    .input-footer {
      max-width: 720px;
      margin: 8px auto 0;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: var(--font-body);
      letter-spacing: 0.02em;
    }

    /* SCROLLED STATE */
    @media (max-width: 600px) {
      header { padding: 0 20px; }
      .header-right { gap: 10px; }
      .status-pill { display: none; }
      .input-bar { padding: 12px 16px 20px; }
      .chat-inner { padding: 0 16px; }
      .hero-title { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

<div class="glow"></div>

<!-- HEADER -->
<header>
  <a href="#" class="logo">
    <div class="logo-dot"></div>
    Nexo<span>AI</span>
  </a>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot"></div>
      Online
    </div>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</header>

<!-- HERO (empty state) -->
<div class="hero" id="hero">
  <p class="hero-eyebrow">Powered by Claude</p>
  <h1 class="hero-title">Your business,<br><em>answered.</em></h1>
  <p class="hero-sub">Ask anything about Nexo Sells — orders, products, shipping, returns. I'm here to help.</p>
  <div class="suggestions">
    <button class="suggestion-btn" onclick="suggest(this)">How do I track my order?</button>
    <button class="suggestion-btn" onclick="suggest(this)">What sizes do you have?</button>
    <button class="suggestion-btn" onclick="suggest(this)">How do I pay via JazzCash?</button>
    <button class="suggestion-btn" onclick="suggest(this)">What's your return policy?</button>
    <button class="suggestion-btn" onclick="suggest(this)">How long does delivery take?</button>
    <button class="suggestion-btn" onclick="suggest(this)">Do you ship nationwide?</button>
  </div>
</div>

<!-- CHAT -->
<div class="chat-area" id="chatArea">
  <div class="chat-inner" id="chatInner"></div>
</div>

<!-- INPUT -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="msgInput" placeholder="Ask anything about Nexo Sells..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="input-footer">Nexo AI · Powered by Claude · For Nexo Sells customers</p>
</div>

<script>
  // ══════════════════════════════════════════
  // PASTE YOUR GEMINI API KEY HERE (only here)
  const GEMINI_API_KEY = 'PASTE_YOUR_KEY_HERE';
  // ══════════════════════════════════════════

  const SYSTEM_PROMPT = `You are Nexo AI, the friendly and sharp customer support assistant for Nexo Sells — a Pakistani streetwear ecommerce brand.

Your personality: Gen Z energy, direct, helpful, no fluff. Keep responses concise but complete. Use casual language but stay professional.

Business facts you know:
- Store name: Nexo Sells
- We sell: streetwear — tees, hoodies, bottoms, accessories
- Shipping: PKR 200 flat, FREE over PKR 2000. Dispatch within 24 hours, delivery 3-5 business days nationwide
- Payment: JazzCash, EasyPaisa, Cash on Delivery. Customer pays, sends screenshot to WhatsApp, we confirm
- Returns: 7-day window, item must be unused with tags. Customer covers return shipping unless item is defective
- WhatsApp: the fastest way to reach us for order issues
- We ship all across Pakistan
- Sizes: S, M, L, XL, XXL on most items
- Fit: oversized/relaxed. If between sizes, size down

Keep responses under 150 words unless the question genuinely needs more detail. Format clearly with short paragraphs or bullet points when listing info. Never make up order details or tracking info you don't have access to. If someone has a specific order issue, direct them to WhatsApp.`;

  const messages = [];
  let isLoading = false;

  const chatInner = document.getElementById('chatInner');
  const hero = document.getElementById('hero');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function suggest(btn) {
    input.value = btn.textContent;
    input.dispatchEvent(new Event('input'));
    sendMessage();
  }

  function hideHero() {
    hero.classList.add('hidden');
  }

  function addMessage(role, content) {
    const msg = { role, content };
    messages.push(msg);

    const el = document.createElement('div');
    el.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
    el.innerHTML = `
      <div class="msg-avatar">${role === 'user' ? 'YOU' : 'AI'}</div>
      <div class="msg-bubble">${formatMessage(content)}</div>
    `;
    chatInner.appendChild(el);
    scrollToBottom();
    return el;
  }

  function formatMessage(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>')
      .replace(/^• (.+)$/gm, '<li>$1</li>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^(.+)$/, '<p>$1</p>');
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typingIndicator';
    el.innerHTML = `
      <div class="typing-avatar">AI</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    `;
    chatInner.appendChild(el);
    scrollToBottom();
  }

  function hideTyping() {
    document.getElementById('typingIndicator')?.remove();
  }

  function scrollToBottom() {
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isLoading) return;

    hideHero();
    isLoading = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    showTyping();

    try {
      const history = messages.slice(0, -1).map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.content }]
      }));

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: [
              ...history,
              { role: 'user', parts: [{ text: text }] }
            ],
            generationConfig: { maxOutputTokens: 800, temperature: 0.7 }
          })
        }
      );

      const data = await response.json();
      hideTyping();

      if (data.error) {
        addMessage('assistant', `Something went wrong: ${data.error.message}. Try again or contact us on WhatsApp.`);
      } else {
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "I couldn't get a response. Please try again.";
        addMessage('assistant', reply);
      }
    } catch (err) {
      hideTyping();
      addMessage('assistant', "Connection issue. Check your internet and try again, or reach us on WhatsApp directly.");
    }

    isLoading = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function clearChat() {
    messages.length = 0;
    chatInner.innerHTML = '';
    hero.classList.remove('hidden');
  }
</script>
</body>
</html>
